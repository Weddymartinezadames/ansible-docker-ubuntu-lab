---
- name: Automatización de configuración en servidores virtuales
  hosts: servidores_ubuntu
  become: yes

  tasks:
    - name: 1. Actualizar la caché de APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. Crear el usuario 'itla'
      user:
        name: itla
        state: present
        shell: /bin/bash
        create_home: yes

    - name: 3. Crear la carpeta 'app'
      file:
        path: /app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: 4. Crear el archivo hola.txt en la carpeta app
      copy:
        content: "¡Hola desde Ansible automatizado en el servidor!\n"
        dest: /app/hola.txt
        owner: itla
        group: itla
        mode: '0644'

    - name: 5. Instalar aplicaciones cowsay y htop
      apt:
        name:
          - cowsay
          - htop
        state: present
